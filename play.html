<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M10YFWM4RX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-M10YFWM4RX');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Play - Synswer Games</title>
    <link rel="canonical" href="https://synswer.com/play.html" />
    <meta name="theme-color" content="#07070b" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Synswer" />
    <meta property="og:title" content="Play free games on Synswer. Can you beat my score?" />
    <meta property="og:description" content="Mini games with weekly leaderboards. Play now and see if you can top the board." />
    <meta property="og:image" content="https://synswer.com/icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="google-adsense-account" content="ca-pub-8679733413041334" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="games.css" />
    <script>
      try { if (localStorage.getItem("synswer-consent")) document.documentElement.classList.add("consent-set"); } catch (e) {}
    </script>
    <script async defer type="module" src="api/auth/altcha.js"></script>
  </head>
  <body>
    <main class="games-page">
      <a class="back" href="games.html">&larr; All games</a>
      <h1 id="game-title">Game</h1>
      <div class="game-layout">
        <section class="game-card">
          <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
          <div class="canvas-wrap" id="wrap" style="--cw:420px;--ar:1">
            <canvas id="game" width="420" height="420"></canvas>
            <div class="overlay" id="overlay">
              <h2 id="ov-title">Game</h2>
              <p id="ov-text"></p>
              <button class="btn" id="start" type="button">Play</button>
              <button class="btn btn-ghost" id="save" type="button" hidden>Save score</button>
            </div>
          </div>
          <p class="hint" id="game-hint"></p>
        </section>
        <aside class="board">
          <h2>Leaderboard</h2>
          <ol id="leaderboard"></ol>
        </aside>
      </div>
      <div class="ad-box" data-ad-box hidden style="margin:24px 0 0;text-align:center;overflow:hidden"></div>
    </main>
    {footer}
    {cookie}
    <script src="app.js"></script>
    <script src="sound.js"></script>
    <script src="gamesmeta.js"></script>
    <script src="play.js"></script>
  </body>
</html>
