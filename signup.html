<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account - Synswer</title>
    <meta name="theme-color" content="#07070b" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8679733413041334" crossorigin="anonymous"></script>
    <script>try { if (localStorage.getItem("synswer-consent")) document.documentElement.classList.add("consent-set"); } catch (e) {}</script>
    <script async defer type="module" src="api/auth/altcha.js"></script>
  </head>
  <body>
    {bg3d}
    <div class="glow" aria-hidden="true"></div>
    <main class="auth">
      <form class="auth-card" id="auth-form" data-auth="signup">
        <h1>Create account</h1>
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="name" required />
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
        <label for="password">Password (8 characters or more)</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />
        <altcha-widget id="captcha"></altcha-widget>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="btn" type="submit">Create account</button>
        <p class="alt">Already have an account? <a href="login.html" data-carry>Sign in</a></p>
        <p class="alt"><a href="index.html">Back to Synswer</a></p>
      </form>
    </main>
    {footer}
    {cookie}
    <script src="app.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
