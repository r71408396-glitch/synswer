<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Community - Synswer</title>
    <meta name="theme-color" content="#07070b" />
    <meta name="google-adsense-account" content="ca-pub-8679733413041334" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>try { if (localStorage.getItem("synswer-consent")) document.documentElement.classList.add("consent-set"); } catch (e) {}</script>
  </head>
  <body style="display:none">
    <div class="glow" aria-hidden="true"></div>
    <main class="community">
      <nav class="c-nav" aria-label="Community">
        <a class="brand" href="index.html">Synswer Community</a>
        <div class="me">
          <a class="btn btn-ghost" id="admin-link" href="admin.html" hidden>Admin</a>
          <span>Signed in as <b id="me-id">...</b></span>
          <button type="button" class="btn btn-ghost" id="signout">Sign out</button>
        </div>
      </nav>
      <form class="composer" id="composer" autocomplete="off">
        <label for="post-text" class="eyebrow">Share a text post</label>
        <textarea id="post-text" maxlength="280" placeholder="What is on your mind?" required></textarea>
        <div class="row">
          <span class="count" id="count">0 / 280</span>
          <button class="btn" id="post-btn" type="submit">Post</button>
        </div>
        <p class="form-error" id="post-error" role="alert"></p>
        <p class="note">Posts appear straight away. Use the flag on any post to report it to the admins.</p>
        <p class="form-error" id="ban-note" hidden>Your account has been banned from posting, replying and voting.</p>
      </form>
      <div class="ad-box" data-ad-box hidden style="margin:16px 0;text-align:center;overflow:hidden"></div>
      <ul class="feed" id="feed"><li class="empty">Loading posts...</li></ul>
    </main>
    <p class="toast" id="toast" role="status" hidden></p>
    <dialog class="dlg" id="confirm-dlg">
      <h2 id="confirm-title">Delete?</h2>
      <p id="confirm-text"></p>
      <div class="row">
        <button type="button" class="btn btn-ghost" id="confirm-no">Cancel</button>
        <button type="button" class="btn" id="confirm-yes">Delete</button>
      </div>
    </dialog>
    {footer}
    {cookie}
    <script src="app.js"></script>
    <script src="community.js"></script>
  </body>
</html>
