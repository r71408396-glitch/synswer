<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M10YFWM4RX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-M10YFWM4RX');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Articles - Synswer</title>
    <meta name="description" content="Articles and guides from Synswer." />
    <link rel="canonical" href="https://synswer.com/articles.html" />
    <meta name="theme-color" content="#031b1a" />
    <meta name="google-adsense-account" content="ca-pub-8679733413041334" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="blog.css" />
    <script>
      try { if (localStorage.getItem("synswer-consent")) document.documentElement.classList.add("consent-set"); } catch (e) {}
    </script>
  </head>
  <body>
    {bg3d}
    <div class="glow" aria-hidden="true"></div>
    {games_link}
    <main class="blog">
      <a class="back" href="index.html">&larr; Back to Synswer</a>
      <h1>Articles</h1>
      <p class="lead">Guides, news and ideas from the Synswer team.</p>
      <form class="blog-search" id="blog-search" role="search">
        <label for="blog-q" class="eyebrow">Search articles</label>
        <input id="blog-q" type="search" maxlength="80" placeholder="Search by title or keyword" autocomplete="off" />
      </form>
      <div class="blog-filters" id="filters" hidden></div>
      <ul class="post-grid" id="posts">
<ul class="page-links" data-kreova-links="articles" data-kreova-href="article.html?slug={{slug}}" data-kreova-text="{{title}}"></ul>
<li class="post-empty">Loading articles...</li></ul>
      <div class="ad-box" data-ad-box hidden style="margin:28px 0 0;text-align:center;overflow:hidden"></div>
    </main>
    {footer}
    {cookie}
    <script type="application/json" data-kreova-rows="articles" data-kreova-query="select=id,title,slug,excerpt,image_url,image_alt,category,tags,published_at&amp;status=eq.published&amp;sort=-published_at&amp;limit=10"></script>
    <script src="app.js"></script>
    <script src="blog.js"></script>
  </body>
</html>
