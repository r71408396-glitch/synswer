<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New password - Synswer</title>
    <link rel="canonical" href="https://synswer.com/reset.html" />
    <meta name="theme-color" content="#07070b" />
    <meta name="google-adsense-account" content="ca-pub-8679733413041334" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>try { if (localStorage.getItem("synswer-consent")) document.documentElement.classList.add("consent-set"); } catch (e) {}</script>
  </head>
  <body>
    {bg3d}
    <div class="glow" aria-hidden="true"></div>
    <main class="auth">
      <form class="auth-card" id="auth-form" data-auth="reset">
        <h1>Choose a new password</h1>
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="btn" type="submit">Save password</button>
        <p class="alt">Link expired? <a href="forgot.html">Send a new one</a></p>
      </form>
    </main>
    {footer}
    {cookie}
    <script src="app.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
