<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Topic Spaces - Synswer</title>
    <meta name="description" content="Ask questions, share answers and build reputation in Synswer Topic Spaces." />
    <link rel="canonical" href="https://synswer.com/spaces.html" />
    <meta name="theme-color" content="#031b1a" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="spaces.css" />
    <script>try { if (localStorage.getItem("synswer-consent")) document.documentElement.classList.add("consent-set"); } catch (e) {}</script>
  </head>
  <body>
    {bg3d}
    <div class="glow" aria-hidden="true"></div>
    <main class="sp-wrap">
      <div class="sp-top">
        <div>
          <a class="back" href="index.html">&larr; Back to Synswer</a>
          <h1>Topic Spaces</h1>
        </div>
        <div class="sp-row" style="margin:0">
          <a class="sp-btn ghost" href="community.html" style="text-decoration:none">Social feed</a>
          <button type="button" class="sp-btn" id="new-thread">Ask a question</button>
        </div>
      </div>
      <div class="sp-grid">
        <aside class="sp-left" aria-label="Topic spaces">
          <div class="sp-card">
            <h2>Spaces</h2>
            <input class="sp-search" id="space-filter" type="search" placeholder="Filter spaces" aria-label="Filter spaces" />
            <ul class="sp-spaces" id="spaces"></ul>
          </div>
        </aside>
        <section aria-label="Threads" id="center">
          <div class="sp-tabs" id="tabs"></div>
          <ul class="sp-feed" id="feed"><li class="sp-empty">Loading threads...</li></ul>
        </section>
        <aside class="sp-right" aria-label="Community widgets">
          <div class="sp-card">
            <h3>Top contributors this week</h3>
            <ul class="sp-contrib" id="contrib"><li class="sp-meta">Loading...</li></ul>
          </div>
          <div class="sp-card">
            <h3>Live AI insight</h3>
            <div id="insight" class="sp-snip">Open a thread to see what Synswer AI makes of it.</div>
          </div>
        </aside>
      </div>
    </main>
    <dialog class="sp-dlg" id="dlg"></dialog>
    {footer}
    {cookie}
    <script src="app.js"></script>
    <script src="media-safe.js"></script>
    <script src="spaces.js"></script>
  </body>
</html>
